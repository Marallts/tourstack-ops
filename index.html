<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TourStack — Operations</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23241640'/%3E%3Cpath fill='%23fff' d='M4 4 H22 L27 9 H9 Z'/%3E%3Cpath fill='%23fff' d='M7 13 H19 L24 18 H12 Z'/%3E%3Cpath fill='%23fff' d='M10 22 H15 L20 27 H15 Z'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F6F6F4; --card:#FFFFFF; --ink:#17181A; --mute:#5B5E62; --line:#DDDDDB;
    --route:#1C1D1F; --route-soft:#EDEDEB; --warn:#AA3724; --warn-soft:#F7DED8;
    --ok:#2F6B4F; --ok-soft:#DDE9E2; --tint:#EFEFED;
    --r:6px;
    --brandgrad:
      radial-gradient(ellipse 90% 75% at 88% 15%, #7FC0F5 0%, rgba(127,192,245,0) 70%),
      radial-gradient(ellipse 100% 90% at 55% 0%,  #3355E0 0%, rgba(51,85,224,0) 65%),
      radial-gradient(ellipse 90% 95% at 8% 62%,  #E8483C 0%, rgba(232,72,60,0) 62%),
      radial-gradient(ellipse 100% 85% at 82% 98%, #F5DFB4 0%, rgba(245,223,180,0) 65%),
      linear-gradient(155deg, #241640 0%, #3B2360 30%, #6B2A4A 62%, #7C3430 100%);
  }
  *{box-sizing:border-box}
  .brandmark{width:20px;height:20px;flex:none}
  html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--route)}

  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .mtopbar{display:none}
  @media (max-width:760px){
    .app{grid-template-columns:1fr}
    .rail{display:none !important}
    .mtopbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:8;background:var(--brandgrad);padding:12px 16px;font-weight:600;
      color:#fff; --ink:#fff; --mute:rgba(255,255,255,.75); --tint:rgba(255,255,255,.16);}
    .mbrand{display:flex;align-items:center;gap:8px}
    .mtopbar #mAccountBtn{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;padding:2px 8px;border-radius:var(--r)}
    .mtopbar #mAccountBtn:hover{background:var(--tint)}
    .main{padding-bottom:84px}
    .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding:10px 4px calc(10px + env(safe-area-inset-bottom))}
    .tabbar button{flex:1;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:8px 2px;color:var(--mute);font-size:13px;border-radius:var(--r)}
    .tabbar button.on{color:var(--route);font-weight:600;background:var(--tint)}
  }
  @media (min-width:761px){ .tabbar{display:none} }

  /* rail */
  .rail{background:var(--brandgrad);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;
    color:#fff; --ink:#fff; --mute:rgba(255,255,255,.72); --line:rgba(255,255,255,.22); --tint:rgba(255,255,255,.14); --route-soft:rgba(255,255,255,.22); --route:#fff; --warn:#FF9585;}
  .rail h1{font-size:17px;font-weight:600;margin:0 0 4px 6px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
  .rail h1 small{display:block;color:var(--mute);font-weight:400;font-size:13px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:8px 10px;white-space:nowrap}
  .nav button:hover{background:var(--tint)}
  .nav button.on{background:var(--route-soft);color:var(--route);font-weight:600}
  .nav .cnt{font-size:12px;color:var(--mute);background:var(--tint);border-radius:10px;padding:1px 7px;min-width:22px;text-align:center}
  .nav button.on .cnt{background:#fff;color:#1C1D1F}
  .nav .grp{color:var(--mute);font-size:12px;margin:10px 0 2px 10px}
  .nav button.grp{background:none;border:0;padding:0;width:auto;text-align:left;cursor:pointer}
  .nav button.grp:hover{color:var(--ink)}
  .nav button.grp.on{color:var(--route);font-weight:600}
  .foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
  .foot button{font-size:12px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:var(--r);padding:5px 8px}
  .foot button:hover{color:var(--ink)}

  /* main */
  .main{padding:26px 30px 60px;max-width:960px}
  @media (max-width:760px){.main{padding:18px 14px 60px}}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .head h2{font-size:26px;font-weight:600;margin:0;letter-spacing:-.02em}
  .head .sub{color:var(--mute)}

  /* mobile client sub-nav: back + swap to prev/next client */
  .csubnav{display:none}
  @media (max-width:760px){
    .csubnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
    .csubnav .back{background:none;border:0;color:var(--mute);font-size:14px;padding:4px 0}
    .csubnav .swap{display:flex;gap:4px}
    .csubnav .swap button{background:var(--tint);border:0;border-radius:var(--r);width:32px;height:32px;font-size:16px;color:var(--ink)}
    .csubnav .swap button:disabled{opacity:.35}
  }

  /* the "More" menu screen (mobile) */
  .morelist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .morelist li{border-top:1px solid var(--line)}
  .morelist li:first-child{border-top:0}
  .morelist button{width:100%;text-align:left;background:none;border:0;padding:14px 16px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .morelist button .cnt{font-size:12px;color:var(--mute);background:var(--tint);border-radius:10px;padding:1px 7px}
  .morewho{color:var(--mute);font-size:13px;padding:0 2px 10px}

  /* the 50-hour track — the one memorable element */
  .track{margin:6px 0 26px}
  .track .bar{position:relative;height:34px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex}
  .track .seg{height:100%;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;border-right:1px solid rgba(255,255,255,.35)}
  .track .seg.thin{padding:0}
  .track .cap{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
  .track .legend{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:6px}
  .track .over{color:var(--warn);font-weight:600}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .panel h3{font-size:14px;margin:0 0 10px;font-weight:600}
  .panel h3 span{color:var(--mute);font-weight:400;margin-left:6px}

  /* info block */
  .facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  .facts dt{color:var(--mute)}
  .facts dd{margin:0}
  .facts input,.facts textarea{width:100%;border:0;border-bottom:1px dashed transparent;background:none;padding:0;outline:none;resize:vertical}
  .facts input:hover,.facts textarea:hover,.facts input:focus,.facts textarea:focus{border-bottom-color:var(--line)}
  .facts textarea{min-height:56px;line-height:1.4}

  /* compact client header (replaces the old side-by-side client info panel) */
  .clienthead{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .clienthead.facts{display:block}
  .chrow{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-bottom:6px}
  .chfield{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute);font-weight:600}
  .chfield input{width:auto;min-width:70px;font-size:14px;font-weight:400;color:var(--ink)}
  .chrow .btn-sm{margin-left:auto}
  .chnotes{font-size:13px;color:var(--mute);min-height:0!important;line-height:1.4}

  /* tasks */
  .add{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
  .add input[type=text]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--paper);outline:none}
  .add input[type=text]:focus{border-color:var(--route)}
  .add select,.add input[type=date]{border:1px solid var(--line);border-radius:var(--r);padding:7px 8px;background:#fff;font-size:13px}
  .add input[type=number]{width:78px;border:1px solid var(--line);border-radius:var(--r);padding:7px 8px;background:#fff;font-size:13px}
  .add .fld{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
  .add button{background:var(--route);color:#fff;border:0;border-radius:var(--r);padding:8px 14px;font-weight:600}
  .add button:hover{filter:brightness(.95)}
  .tasks{list-style:none;margin:0;padding:0}
  .task{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
  .task:first-child{border-top:0}
  .task input[type=checkbox]{margin:3px 0 0;accent-color:var(--ok);width:16px;height:16px}
  .task .t{display:flex;flex-direction:column;gap:2px}
  .task .t .txt{outline:none}
  .task .t .txt:focus{background:var(--tint);border-radius:3px}
  .task .meta{display:flex;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap;align-items:center}
  .task .meta .who{background:var(--tint);border-radius:10px;padding:0 7px}
  .task .meta .due.late{color:var(--warn);font-weight:600}
  .task .meta .nolog{background:var(--warn-soft);color:var(--warn);border:0;border-radius:10px;padding:1px 8px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .task .meta .nolog:hover{filter:brightness(.95)}
  .task .meta .cl{font-weight:600}
  .task .meta .est{background:var(--tint);border-radius:10px;padding:0 7px}
  .task .meta .priflag{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:0 7px;font-weight:600}
  .statusbadge{border:0;border-radius:10px;padding:0 7px;font:inherit;font-size:12px;font-weight:600;line-height:1.6}
  .statusbadge.st-not_started{background:var(--tint);color:var(--mute)}
  .statusbadge.st-in_progress{background:#FBEFD9;color:#8A6A1E}
  .statuspicker{display:flex;gap:6px;margin-top:6px}
  .statuspicker button{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:7px 4px;font-size:13px;background:none;color:var(--mute);font-weight:600}
  .statuspicker button.on.st-not_started{background:var(--tint);color:var(--ink);border-color:var(--line)}
  .statuspicker button.on.st-in_progress{background:#FBEFD9;color:#8A6A1E;border-color:#FBEFD9}
  .statuspicker button.on.st-done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
  .task .meta .linkcount{background:var(--tint);border-radius:10px;padding:0 7px}
  .task .meta .logged{color:var(--ok)}
  .task .meta .logged.over{color:var(--warn);font-weight:600}
  .task.done .txt{text-decoration:line-through;color:var(--mute)}
  .task .x{background:none;border:0;color:var(--mute);font-size:16px;line-height:1;padding:2px 4px;opacity:0;border-radius:3px}
  .task:hover .x,.task .x:focus{opacity:1}
  .task .x:hover{color:var(--warn);background:var(--warn-soft)}
  .empty{color:var(--mute);font-size:14px;padding:6px 0}
  .filters{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
  .filters button{background:none;border:1px solid var(--line);border-radius:12px;padding:3px 10px;font-size:13px;color:var(--mute)}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .showdone{margin-top:8px;font-size:13px;color:var(--mute);background:none;border:0;padding:0;text-decoration:underline}
  .statusgroup{margin-bottom:6px}
  .statusgroup:last-child{margin-bottom:0}
  .stghead{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);margin:0;padding:10px 2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line)}
  .statusgroup:first-child .stghead{border-top:0}
  .stghead::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
  .stghead.st-not_started::before{background:var(--line)}
  .stghead.st-in_progress::before{background:#D9A63E}
  .stghead.st-done::before{background:var(--ok)}
  .stghead span{color:var(--mute);font-weight:400}
  .stghead::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(-45deg);margin-left:auto;transition:transform .15s}
  .stghead[aria-expanded="true"]::after{transform:rotate(45deg)}
  .grpflag{background:var(--warn-soft);color:var(--warn)!important;border-radius:10px;padding:0 7px;font-weight:600!important;font-size:12px}

  /* client status dashboard headers — same dot language as task groups, but static (no collapse) */
  .dashhead{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink);margin:0;padding:10px 2px;border-top:1px solid var(--line)}
  .statusgroup:first-child .dashhead{border-top:0;padding-top:0}
  .dashhead::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
  .dashhead.st-attention::before{background:var(--warn)}
  .dashhead.st-active::before{background:#D9A63E}
  .dashhead.st-not_started::before{background:var(--line)}
  .dashhead.st-caught_up::before{background:var(--ok)}
  .dashhead span{color:var(--mute);font-weight:400}

  /* public client share page (unauthenticated, read-only) */
  .shareview{background:var(--brandgrad);min-height:100vh;display:flex;justify-content:center;padding:44px 20px}
  .shareview .wrap{max-width:640px;width:100%;margin:0;padding:36px 32px 44px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.18);align-self:flex-start}
  .sharebrand{display:flex;align-items:center;gap:7px;color:var(--mute);font-size:13px;font-weight:600;margin-bottom:22px}
  .sharebrand .brandmark{width:16px;height:16px;color:var(--mute)}
  .shareview h1{font-size:24px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em}
  .shareview .smeta{color:var(--mute);font-size:14px;margin-bottom:28px}
  .shareview .prog{margin-bottom:32px}
  .shareview .prog .bar{height:10px;background:var(--tint);border-radius:6px;overflow:hidden}
  .shareview .prog .fill{height:100%}
  .shareview .prog .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:6px}
  .sgroup{margin-bottom:22px}
  .sgroup h3{font-size:13px;color:var(--mute);font-weight:600;margin:0 0 8px}
  .sghead{display:flex;align-items:center;gap:7px}
  .sghead::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
  .sghead.st-not_started::before{background:var(--line)}
  .sghead.st-in_progress::before{background:#D9A63E}
  .sghead.st-done::before{background:var(--ok)}
  .sghead span{color:var(--mute);font-weight:400}
  .slist{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
  .srow:first-child{border-top:0}
  .srow .stxt{font-size:14px}
  .sright{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .sdue{font-size:12px;color:var(--mute)}
  .stpill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
  .stpill.done{background:var(--tint);color:var(--sharecolor,var(--route))}
  .stpill.prog{background:#FBEFD9;color:#8A6A1E}
  .stpill.todo{background:var(--tint);color:var(--mute)}
  .shareview footer{margin-top:30px;font-size:12px;color:var(--mute)}
  @media (max-width:760px){
    .shareview{padding:0}
    .shareview .wrap{border-radius:18px 18px 0 0;border:0;margin-top:28px;min-height:calc(100vh - 28px);padding:28px 20px 44px}
  }

  /* calendar */
  .calnav{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px}
  .calnav button[data-cal]{background:none;border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;color:var(--ink);line-height:1}
  .calnav button[data-cal]:hover{background:var(--tint)}
  .calnav .lbl{font-weight:600;min-width:130px;text-align:center}
  .calnav .today{margin-left:auto;font-size:12px;color:var(--mute)}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .calgrid .wd{font-size:11px;color:var(--mute);text-align:center;padding:2px 0 6px}
  .calcell{min-height:64px;border:1px solid var(--line);border-radius:var(--r);padding:4px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--card)}
  .calcell:hover{border-color:var(--route)}
  .calcell.empty{border-color:transparent;cursor:default;background:none}
  .calcell.today{border-color:var(--route);box-shadow:inset 0 0 0 1px var(--route)}
  .calcell.sel{background:var(--route-soft);border-color:var(--route)}
  .calcell .dnum{font-size:11px;color:var(--mute);font-weight:600}
  .calcell.today .dnum{color:var(--route)}
  .calcell .chip{display:flex;align-items:center;gap:3px;overflow:hidden;color:var(--ink)}
  .calcell .chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .calcell .chip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .calcell .more{color:var(--mute)}
  @media (max-width:760px){.calcell{min-height:44px;font-size:10px}.calcell .chip span:last-child{display:none}}

  /* staff */
  .load{margin:6px 0 12px}
  .load .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
  .load .b{height:10px;background:var(--tint);border-radius:5px;overflow:hidden}
  .load .b i{display:block;height:100%;background:var(--ok)}
  .load .b i.over{background:var(--warn)}
  .alloc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
  .alloc input{width:52px;border:0;border-bottom:1px dashed var(--line);text-align:right;background:none;outline:none}

  /* time tracking */
  .task .actions{display:flex;gap:2px}
  .logt{background:none;border:0;color:var(--mute);font-size:14px;line-height:1;padding:2px 5px;opacity:0;border-radius:3px}
  .task:hover .logt,.logt:focus{opacity:1}
  .logt:hover{color:var(--route);background:var(--route-soft)}
  .timeform{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px}
  .timeform input,.timeform select{border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;background:#fff;font-size:13px}
  .timeform input[type=number]{width:64px}
  .timeform button{background:var(--route);color:#fff;border:0;border-radius:var(--r);padding:5px 10px;font-weight:600;font-size:13px}
  .timeform button.cancel{background:none;color:var(--mute);border:1px solid var(--line);font-weight:400}
  .addtime{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap}
  .addtime input,.addtime select{border:1px solid var(--line);border-radius:var(--r);padding:7px 8px;background:var(--paper);font-size:13px}
  .addtime input[type=number]{width:70px}
  .addtime input[type=text]{flex:1;min-width:140px}
  .addtime button{background:var(--route);color:#fff;border:0;border-radius:var(--r);padding:8px 14px;font-weight:600}
  .rangepick{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px;color:var(--mute)}
  .rangepick input[type=date]{border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;background:#fff;font-size:13px;color:var(--ink)}
  .hbar{position:relative;height:7px;background:var(--tint);border-radius:4px;overflow:hidden;display:flex;width:140px}
  .hbar .seg{height:100%}
  .hourstbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
  .hourstbl th,.hourstbl td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  .hourstbl th:first-child,.hourstbl td:first-child{text-align:left;white-space:normal}
  .hourstbl thead th{color:var(--mute);font-weight:600}
  .hourstbl tbody td{color:var(--mute)}
  .hourstbl tbody td:last-child{color:var(--ink)}

<script>
/* ---------- data ---------- */
const PEOPLE = () => ["Oli",...S.staff.map(x=>x.name),...(S.freelancers||[]).map(x=>x.name)];
// contrast-checked (≥4.5:1 white-on-color) palette, cycled for new clients
const CLIENT_PALETTE = ["#3D5A80","#2F6B4F","#4D774C","#556F58","#966832","#8C6A5D","#2E6E6B","#6B4C7A","#9C4A5C","#8A6A1E","#4A5A72","#4E4A8C","#A24A34","#3A6B4A"];


function t(){return Math.random().toString(36).slice(2,9)}

const SUPABASE_URL = "https://oorjrhiiejwcoinqireq.supabase.co";
const SUPABASE_KEY = "sb_publishable_B0MtkyQ580H-mPcB5VaM3A_vNxSG6D2";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let S = {
  clients:[], tasks:[], timeEntries:[], staff:[], freelancers:[],
  timeView:{mode:"week",start:"",end:""}, timeGroupBy:"who", loggingFor:null,
  calMonth:"", calDay:null, cap:50, view:"cal", filter:"all", groupOpen:{not_started:false,in_progress:false,done:false}
};
let ME = null; // this browser's `people` row, once identity is claimed
const $ = s => document.querySelector(s);

/* ---------- row <-> app-model mapping (DB columns differ slightly from the old local shape) ---------- */
const mapTask = r => ({id:r.id, client:r.client_id, text:r.text, assignees:r.assignees||[], due:r.due||"", done:r.done, status:r.status||"not_started", pri:r.pri, est:r.est, links:r.links||[]});
const mapEntry = r => ({id:r.id, client:r.client_id, taskId:r.task_id, who:r.who, date:r.date, hours:+r.hours, text:r.text||""});

/* ---------- storage: Supabase, shared across the team ---------- */
async function loadData(){
  const [{data:clients,error:e1},{data:tasks,error:e2},{data:timeEntries,error:e3},{data:people,error:e4}] = await Promise.all([
    sb.from("clients").select("*").order("created_at"),
    sb.from("tasks").select("*").order("created_at"),
    sb.from("time_entries").select("*").order("date",{ascending:false}),
    sb.from("people").select("*").order("created_at"),
  ]);
  const err = e1||e2||e3||e4; if(err){ toast("Couldn't load — "+err.message); throw err; }
  S.clients = clients||[];
  S.tasks = (tasks||[]).map(mapTask);
  S.timeEntries = (timeEntries||[]).map(mapEntry);
  S.staff = (people||[]).filter(p=>p.kind==="staff");
  S.freelancers = (people||[]).filter(p=>p.kind==="freelancer");
  S.calMonth = today().slice(0,7);
}
// fire-and-forget persist for optimistic local edits — UI already updated, this just syncs
function persist(promise){ promise.then(({error})=>{ if(error) toast("Sync error: "+error.message); }); }

async function saveTask(payload, id){
  if(id){
    const {data,error} = await sb.from("tasks").update(payload).eq("id",id).select().single();
    if(error) return toast("Error: "+error.message);
    const x=S.tasks.find(z=>z.id===id); if(x) Object.assign(x, mapTask(data));
    render(); toast("Saved");
  } else {
    const {data,error} = await sb.from("tasks").insert(payload).select().single();
    if(error) return toast("Error: "+error.message);
    upsertFront(S.tasks, mapTask(data)); render(); toast("Added");
  }
}
async function deleteTask(id){
  S.tasks=S.tasks.filter(z=>z.id!==id); render(); toast("Deleted");
  persist(sb.from("tasks").delete().eq("id",id));
}
async function addTimeEntry(row){
  const {data,error} = await sb.from("time_entries").insert(row).select().single();
  if(error) return toast("Error: "+error.message);
  upsert(S.timeEntries, mapEntry(data)); render(); toast("Logged");
}
async function deleteTimeEntry(id){
  S.timeEntries=S.timeEntries.filter(z=>z.id!==id); render(); toast("Deleted");
  persist(sb.from("time_entries").delete().eq("id",id));
}
async function addClientRow(name,hrs){
  const color = CLIENT_PALETTE[S.clients.length % CLIENT_PALETTE.length];
  const {data,error} = await sb.from("clients").insert({name,hrs,color,staff:"",contact:"",notes:""}).select().single();
  if(error) return toast("Error: "+error.message);
  upsert(S.clients, data); render(); renderNav(); toast("Added");
}
async function addPerson(row){
  const {data,error} = await sb.from("people").insert(row).select().single();
  if(error){ toast("Error: "+error.message); return null; }
  return data;
}
async function removeFreelancer(f){
  if(!confirm("Remove "+f.name+"? They'll be removed from any tasks they're assigned to.")) return;
  const affected = S.tasks.filter(x=>(x.assignees||[]).includes(f.name));
  affected.forEach(x=>{ x.assignees = x.assignees.filter(a=>a!==f.name); if(!x.assignees.length) x.assignees=["Oli"]; });
  S.freelancers=S.freelancers.filter(z=>z.id!==f.id);
  render();
  persist(sb.from("people").delete().eq("id",f.id));
  affected.forEach(x=>persist(sb.from("tasks").update({assignees:x.assignees}).eq("id",x.id)));
}

/* ---------- realtime: keep every open tab in sync ---------- */
// both upsert() (append-style) and upsertFront() (unshift-style) are duplicate-safe:
// a realtime echo of our own insert can arrive before our own optimistic update runs
// (the two happen on unpredictable relative timing), so every "add locally" path must
// check for an existing id rather than blindly push/unshift.
function upsert(arr, mapped){ const i=arr.findIndex(z=>z.id===mapped.id); if(i>=0) arr[i]=mapped; else arr.push(mapped); }
function upsertFront(arr, mapped){ const i=arr.findIndex(z=>z.id===mapped.id); if(i>=0) arr[i]=mapped; else arr.unshift(mapped); }
function subscribeRealtime(){
  sb.channel("tourstack-db")
    .on("postgres_changes",{event:"*",schema:"public",table:"clients"}, p=>{
      if(p.eventType==="DELETE"){ S.clients=S.clients.filter(z=>z.id!==p.old.id); } else upsert(S.clients,p.new);
      render(); renderNav(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks"}, p=>{
      if(p.eventType==="DELETE"){ S.tasks=S.tasks.filter(z=>z.id!==p.old.id); } else upsert(S.tasks,mapTask(p.new));
      render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"time_entries"}, p=>{
      if(p.eventType==="DELETE"){ S.timeEntries=S.timeEntries.filter(z=>z.id!==p.old.id); } else upsert(S.timeEntries,mapEntry(p.new));
      render(); })
    .on("postgres_changes",{event:"*",schema:"public",table:"people"}, p=>{
      if(p.eventType==="DELETE"){ S.staff=S.staff.filter(z=>z.id!==p.old.id); S.freelancers=S.freelancers.filter(z=>z.id!==p.old.id); }
      else { S.staff=S.staff.filter(z=>z.id!==p.new.id); S.freelancers=S.freelancers.filter(z=>z.id!==p.new.id);
        if(p.new.kind==="staff") S.staff.push(p.new); else if(p.new.kind==="freelancer") S.freelancers.push(p.new); }
      render(); })
    .subscribe();
}
function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),1800); }

/* ---------- auth & identity ---------- */
let authMode = "signin";
async function initAuth(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $("#loadingScreen").hidden=true; $("#authScreen").hidden=false; return; }
  await afterSignIn(session);
}
async function afterSignIn(session){
  $("#loadingScreen").hidden=false; $("#authScreen").hidden=true; $("#claimScreen").hidden=true; $("#app").hidden=true;
  const {data:mine} = await sb.from("people").select("*").eq("auth_user_id",session.user.id).maybeSingle();
  if(mine){ ME=mine; await bootApp(); return; }
  const {data:unclaimed} = await sb.from("people").select("*").is("auth_user_id",null);
  renderClaimScreen(unclaimed||[], session.user.id);
  $("#loadingScreen").hidden=true; $("#claimScreen").hidden=false;
}
/* ---------- public client share page (no login required) ---------- */
let shareRefreshTimer = null;
async function renderPublicShare(clientId){
  $("#loadingScreen").hidden=false; $("#authScreen").hidden=true; $("#claimScreen").hidden=true; $("#app").hidden=true;
  const fmtLong = d => { if(!d) return ""; const dt=new Date(d+"T00:00"); return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); };
  const paint = async () => {
    const [{data:info,error:e1},{data:tasks,error:e2}] = await Promise.all([
      sb.rpc("get_client_share_info",{share_client_id:clientId}),
      sb.rpc("get_client_share_tasks",{share_client_id:clientId}),
    ]);
    const row = (info && info[0]) || null;
    const shareHeader = `<div class="sharebrand"><svg class="brandmark" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2 2 H24 L30 8 H8 Z"/><path d="M6 13 H20 L26 19 H12 Z"/><path d="M10 24 H16 L22 30 H16 Z"/></svg>TourStack</div>`;
    if(e1 || e2 || !row){
      $("#shareContent").innerHTML = shareHeader + `<h1>Link not found</h1><p class="smeta">This share link doesn't point to a client we know about — check it was copied in full.</p>`;
      $("#loadingScreen").hidden=true; $("#shareScreen").hidden=false;
      return;
    }
    $("#shareScreen").style.setProperty("--sharecolor", row.color);
    const parsed = (tasks||[]).map(t=>({ text:t.text, statusKey:t.status||"not_started", status:STATUS_LABELS[t.status||"not_started"]||"Not started", due:t.due }));
    const order = [["not_started","Not started"],["in_progress","In progress"],["done","Done"]];
    const total=parsed.length, done=parsed.filter(p=>p.statusKey==="done").length;
    const pct = total? Math.round(done/total*100) : 0;
    const sections = order.map(([key,label])=>{
      const rows = parsed.filter(p=>p.statusKey===key);
      if(!rows.length) return "";
      const rowsHtml = rows.map(p=>`<li class="srow"><span class="stxt">${esc(p.text)}</span>${p.due?`<span class="sdue">${fmtLong(p.due)}</span>`:""}</li>`).join("");
      return `<div class="sgroup"><h3 class="sghead st-${key}">${label}<span>${rows.length}</span></h3><ul class="slist">${rowsHtml}</ul></div>`;
    }).join("");
    $("#shareContent").innerHTML = shareHeader + `<h1>${esc(row.name)}</h1>
      <div class="smeta">Progress overview — live, updated ${fmtLong(today())}</div>
      <div class="prog"><div class="bar"><div class="fill" style="width:${pct}%;background:${row.color}"></div></div><div class="lbl"><span>${done} of ${total} complete</span><span>${pct}%</span></div></div>
      ${sections || `<div class="smeta">No tasks yet.</div>`}
      <footer>Shared from TourStack — this page updates automatically.</footer>`;
    $("#loadingScreen").hidden=true; $("#shareScreen").hidden=false;
  };
  await paint();
  clearInterval(shareRefreshTimer);
  shareRefreshTimer = setInterval(paint, 45000); // light polling so it reflects new changes without a manual reload
}

/* ---------- helpers ---------- */
const client = id => S.clients.find(c=>c.id===id);
const open = () => S.tasks.filter(x=>!x.done);
const today = () => new Date().toISOString().slice(0,10);
const fmtDue = d => { if(!d) return ""; const dt=new Date(d+"T00:00"); return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const startOfWeek = ds => { const d=new Date(ds+"T00:00"); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); };
const endOfWeek = ds => { const d=new Date(startOfWeek(ds)+"T00:00"); d.setDate(d.getDate()+6); return d.toISOString().slice(0,10); };
const startOfMonth = ds => ds.slice(0,8)+"01";
const endOfMonth = ds => { const d=new Date(ds+"T00:00"); const nd=new Date(d.getFullYear(),d.getMonth()+1,0); return nd.toISOString().slice(0,10); };
function timeRange(){ const v=S.timeView, t=today();
  if(v.mode==="week") return [startOfWeek(t),endOfWeek(t)];
  if(v.mode==="month") return [startOfMonth(t),endOfMonth(t)];
  if(v.mode==="custom") return [v.start||"",v.end||""];
  return [null,null];
}
const entriesInRange = () => { const [s,e]=timeRange(); return (S.timeEntries||[]).filter(x=>(!s||x.date>=s)&&(!e||x.date<=e)); };
const fmtH = n => (Math.round((n||0)*100)/100).toString();
const loggedFor = id => (S.timeEntries||[]).filter(x=>x.taskId===id).reduce((a,x)=>a+(+x.hours||0),0);
// A client's status is derived live from their tasks, not a manual field:
// attention (overdue or done-but-unlogged) > active (something in progress) >
// not_started (open tasks, none started) > caught_up (nothing open)
function clientStatus(c){
  const tasks = S.tasks.filter(x=>x.client===c.id);
  const openTasks = tasks.filter(x=>!x.done);
  const overdue = openTasks.filter(x=>x.due && x.due<today()).length;
  const unlogged = tasks.filter(x=>x.done && !loggedFor(x.id)).length;
  const inProgress = openTasks.filter(x=>x.status==="in_progress").length;
  if(overdue || unlogged) return {key:"attention", overdue, unlogged};
  if(inProgress) return {key:"active", inProgress};
  if(openTasks.length) return {key:"not_started", count:openTasks.length};
  return {key:"caught_up"};
}

function track(){
  const total = S.clients.reduce((a,c)=>a+(+c.hrs||0),0);
  const cap = S.cap; const span = Math.max(total,cap);
  const segs = S.clients.filter(c=>c.hrs>0).map(c=>{ const w=(c.hrs/span)*100; return `<div class="seg ${w<7?"thin":""}" style="width:${w}%;background:${c.color}" title="${esc(c.name)} — ${c.hrs}h">${w>=7?esc(c.name.split(" ")[0])+" "+c.hrs:""}</div>`; }).join("");
  const capPos = (cap/span)*100;
  const over = total>cap;
  return `<div class="track"><div class="bar">${segs}<div class="cap" style="left:calc(${capPos}% - 1px)"></div></div>
    <div class="legend"><span>${total} h planned</span><span class="${over?"over":""}">${over?`${total-cap} h over the ${cap} h cap`:`${cap-total} h free under the ${cap} h cap`}</span></div></div>`;
}

/* ---------- calendar ---------- */
const monthLabel = ym => { const [y,m] = ym.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"}); };
const shiftMonth = (ym,n) => { const [y,m] = ym.split("-").map(Number); const d = new Date(y,m-1+n,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };

function calNav(){
  return `<div class="calnav">
    <button type="button" data-cal="prev" aria-label="Previous month">‹</button>
    <span class="lbl">${monthLabel(S.calMonth)}</span>
    <button type="button" data-cal="next" aria-label="Next month">›</button>
    <button type="button" class="today" data-cal="today">Today</button>
  </div>`;
}

function calGrid(){
  const [y,m] = S.calMonth.split("-").map(Number);
  const first = new Date(y,m-1,1);
  const startOffset = (first.getDay()+6)%7; // Monday-start week
  const daysInM = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInM; d++) cells.push(`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`);
  while(cells.length%7!==0) cells.push(null);
  const wd = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(w=>`<div class="wd">${w}</div>`).join("");
  const td = today();
  const cellHtml = cells.map(ds=>{
    if(!ds) return `<div class="calcell empty"></div>`;
    const dayTasks = S.tasks.filter(x=>x.due===ds && !x.done);
    const dnum = +ds.slice(8,10);
    const isToday = ds===td, isSel = ds===S.calDay;
    const chips = dayTasks.slice(0,3).map(x=>{ const c = client(x.client); return `<div class="chip" title="${esc(x.text)}"><span class="dot" style="background:${c?c.color:"var(--mute)"}"></span><span>${esc(x.text)}</span></div>`; }).join("");
    const more = dayTasks.length>3? `<div class="more">+${dayTasks.length-3} more</div>` : "";
    return `<div class="calcell ${isToday?"today":""} ${isSel?"sel":""}" data-day="${ds}">
      <div class="dnum">${dnum}</div>${chips}${more}</div>`;
  }).join("");
  return `<div class="calgrid">${wd}${cellHtml}</div>`;
}

function taskList(list, opts={}){
  const f = S.filter;
  let items = list.filter(x=> f==="all" || (x.assignees||[]).includes(f));
  const needsLog = x => x.done && !loggedFor(x.id);
  const row = x => { const logged = loggedFor(x.id); const assignees = x.assignees||[]; const links = x.links||[];
    return `<li class="task ${x.done?"done":""}" data-id="${x.id}">
    <input type="checkbox" ${x.done?"checked":""} aria-label="Done">
    <div class="t">
      <div class="tmain" data-open="${x.id}">
        <div class="txt">${esc(x.text)}</div>
        <div class="meta">${opts.showClient?`<span class="cl" style="color:${client(x.client)?.color||"inherit"}">${esc(client(x.client)?.name||"")}</span>`:""}${!x.done?`<button type="button" class="statusbadge st-${x.status||"not_started"}" data-statuscycle="${x.id}" title="Click to update status">${x.status==="in_progress"?"In progress":"Not started"}</button>`:""}${assignees.map(a=>`<span class="who">${esc(a)}</span>`).join("")}${x.due?`<span class="due ${(!x.done&&x.due<today())?"late":""}">${fmtDue(x.due)}</span>`:""}${x.pri?`<span class="priflag">priority</span>`:""}${x.est?`<span class="est">${fmtH(x.est)}h est</span>`:""}${logged?`<span class="logged ${x.est&&logged>x.est?"over":""}">${fmtH(logged)}h logged</span>`:""}${links.length?`<span class="linkcount">🔗 ${links.length}</span>`:""}${needsLog(x)?`<button type="button" class="nolog" data-nolog="${x.id}" title="Marked done with no hours logged yet">⏰ Log hours</button>`:""}</div>
      </div>
      ${S.loggingFor===x.id?`<form class="timeform" data-tid="${x.id}">
        <input type="date" name="date" value="${today()}">
        <select name="who">${PEOPLE().map(p=>`<option ${p===assignees[0]?"selected":""}>${esc(p)}</option>`).join("")}</select>
        <input type="number" name="hours" step="0.25" min="0" placeholder="Hours" required autofocus>
        <button type="submit">Log</button><button type="button" class="cancel">Cancel</button></form>`:""}</div>
    <div class="actions"><button class="logt" data-log="${x.id}" aria-label="Log time" title="Log time">⏰</button></div></li>`; };
  const byDue = (a,b)=>(b.pri-a.pri)||((a.due||"9")>(b.due||"9")?1:-1);
  const notStarted = items.filter(x=>!x.done && (x.status||"not_started")==="not_started").sort(byDue);
  const inProgress = items.filter(x=>!x.done && x.status==="in_progress").sort(byDue);
  const doneItems = items.filter(x=>x.done).sort((a,b)=>needsLog(b)-needsLog(a)); // unlogged-hours ones float to the top once expanded
  if(!items.length) return `<div class="empty">Nothing open. Add one below or enjoy it.</div>`;
  const group = (label, statusKey, rows) => {
    if(!rows.length) return "";
    const open = !!S.groupOpen[statusKey];
    const flag = statusKey==="done" && rows.some(needsLog) ? ` <span class="grpflag">${rows.filter(needsLog).length} need hours logged</span>` : "";
    return `<div class="statusgroup">
      <button type="button" class="stghead st-${statusKey}" data-grouptoggle="${statusKey}" aria-expanded="${open}">${label}<span>${rows.length}</span>${flag}</button>
      ${open?`<ul class="tasks">${rows.map(row).join("")}</ul>`:""}
    </div>`;
  };
  return group("Not started","not_started",notStarted)
    + group("In progress","in_progress",inProgress)
    + group("Done","done",doneItems);
}

function hoursTable(){
  const entries = entriesInRange(), people = PEOPLE(), clients = S.clients, byClient = S.timeGroupBy==="client";
  const matrix = {}; people.forEach(p=>matrix[p]={});
  entries.forEach(e=>{ if(!matrix[e.who]) matrix[e.who]={}; matrix[e.who][e.client]=(matrix[e.who][e.client]||0)+(+e.hours||0); });
  const rowTotal = p => clients.reduce((a,c)=>a+(matrix[p]?.[c.id]||0),0);
  const colTotal = cid => people.reduce((a,p)=>a+(matrix[p]?.[cid]||0),0);
  const grand = people.reduce((a,p)=>a+rowTotal(p),0);
  const outer = byClient? clients : people;
  const inner = byClient? people : clients;
  const maxRow = Math.max(1, ...outer.map(o=> byClient? colTotal(o.id) : rowTotal(o)));

  const thead = `<tr><th></th>${inner.map(i=>`<th>${esc(byClient?i:i.name)}</th>`).join("")}<th>Total</th></tr>`;
  const bodyRows = outer.map(o=>{
    const total = byClient? colTotal(o.id) : rowTotal(o);
    const cells = inner.map(i=>{ const h = byClient? (matrix[i]?.[o.id]||0) : (matrix[o]?.[i.id]||0); return `<td>${h?fmtH(h):"–"}</td>`; }).join("");
    const w = maxRow? (total/maxRow*100) : 0;
    let bar;
    if(byClient){ bar = `<div class="hbar"><div class="seg" style="width:${w}%;background:${o.color}"></div></div>`; }
    else { const segs = clients.filter(c=>(matrix[o]?.[c.id]||0)>0).map(c=>{ const sw = total? ((matrix[o][c.id]/total)*w):0; return `<div class="seg" style="width:${sw}%;background:${c.color}" title="${esc(c.name)} — ${fmtH(matrix[o][c.id])}h"></div>`; }).join(""); bar = `<div class="hbar">${segs}</div>`; }
    const label = byClient? o.name : o;
    return `<tr><td><div class="rowlabel"><span>${esc(label)}</span>${bar}</div></td>${cells}<td><b>${fmtH(total)}</b></td></tr>`;
  }).join("");
  const foot = inner.map(i=>{ const t = byClient? rowTotal(i) : colTotal(i.id); return `<th>${fmtH(t)}</th>`; }).join("");
  const empty = !entries.length ? `<div class="empty">No time logged for this period yet.</div>` : "";
  return `${empty}<div class="tablewrap"><table class="hourstbl"><thead>${thead}</thead><tbody>${bodyRows}</tbody><tfoot><tr><th>Total</th>${foot}<th>${fmtH(grand)}</th></tr></tfoot></table></div>`;
}

function entriesList(){
  const entries = entriesInRange().slice().sort((a,b)=> b.date.localeCompare(a.date));
  if(!entries.length) return `<div class="empty">No time logged for this period yet.</div>`;
  const rows = entries.map(e=>`<li class="entry" data-id="${e.id}">
    <input type="date" name="date" value="${e.date}">
    <select name="client">${S.clients.map(c=>`<option value="${c.id}" ${c.id===e.client?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
    <select name="who">${PEOPLE().map(p=>`<option ${p===e.who?"selected":""}>${esc(p)}</option>`).join("")}</select>
    <input type="number" name="hours" step="0.25" min="0" value="${e.hours}">
    <input type="text" name="text" value="${esc(e.text||"")}" placeholder="What was it for?">
    <button type="button" class="x" aria-label="Delete entry">×</button></li>`).join("");
  return `<ul class="entries">${rows}</ul>`;
}

// Builds a standalone, read-only HTML snapshot for one client — task text,
// status, and due date only. No "who", no estimated/logged hours, no

function copyShareLink(cid){
  const c = client(cid); if(!c) return;
  const url = `${location.origin}/share/${c.id}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(
      ()=>toast("Link copied — anyone with it can view "+c.name+"'s progress"),
      ()=>window.prompt("Copy this link:", url)
    );
  } else {
    window.prompt("Copy this link:", url);
  }
}

    const buckets = {attention:[], active:[], not_started:[], caught_up:[]};
    S.clients.forEach(c=>{ const st = clientStatus(c); buckets[st.key].push({c,st}); });
    const card = (c,st) => {
      let why = "All caught up";
      if(st.key==="attention"){ const parts=[]; if(st.overdue) parts.push(`${st.overdue} overdue`); if(st.unlogged) parts.push(`${st.unlogged} need hours logged`); why=parts.join(" · "); }
      else if(st.key==="active") why = `${st.inProgress} in progress`;
      else if(st.key==="not_started") why = `${st.count} not started`;
      return `<div class="panel clientcard" data-clientcard="${c.id}">
        <h3><button type="button" class="clink" data-goto="c:${c.id}"><span class="cdot" style="background:${c.color}"></span>${esc(c.name)}</button><span>${fmtH(c.hrs||0)}h/wk</span></h3>
        ${c.staff?`<div class="kv">${esc(c.staff)}</div>`:""}
        <div class="kv ${st.key==="attention"?"attn":""}">${why}</div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn-sm" data-goto="c:${c.id}">Open ${esc(c.name)} →</button><button type="button" class="btn-sm" data-share="${c.id}">Copy share link 🔗</button></div>
      </div>`;
    };
    const group = (label, key) => {
      if(!buckets[key].length) return "";
      return `<div class="statusgroup"><h4 class="dashhead st-${key}">${label}<span>${buckets[key].length}</span></h4>
        <div class="grid">${buckets[key].map(({c,st})=>card(c,st)).join("")}</div></div>`;
    };
    m.innerHTML = `<div class="head"><h2>Clients</h2><span class="sub">${S.clients.length} on the books</span></div>
      ${track()}
      <form class="add" id="addclient">
        <input type="text" name="name" placeholder="Client name" required autocomplete="off">
        <input type="number" name="hrs" placeholder="Hours/wk" min="0" step="0.5" style="width:96px">
        <button type="submit">Add client</button>
      </form>
      ${group("Needs attention","attention")}
      ${group("Active","active")}
      ${group("Not started","not_started")}
      ${group("Caught up","caught_up")}`;
  } else if(v==="hours"){
    m.innerHTML = `<div class="head"><h2>Hours</h2><span class="sub">${fmtH(entriesInRange().reduce((a,e)=>a+(+e.hours||0),0))} h logged this period</span></div>
      <div class="panel"><h3>Log time</h3>${addTimeForm()}</div>
      <div class="panel"><h3>Breakdown</h3>${periodSelector()}${groupSelector()}${hoursTable()}</div>
      <div class="panel"><h3>Entries<span>${entriesInRange().length}</span></h3>${entriesList()}</div>`;
  } else if(v==="more"){
    m.innerHTML = `<div class="head"><h2>Account</h2></div>
      <p class="morewho">Signed in as ${esc(ME.name)}</p>
      <ul class="morelist">
        <li><button type="button" id="moreExport">Export</button></li>
        <li><button type="button" id="moreSignout" class="danger">Sign out</button></li>
      </ul>`;
  } else {
    const c = client(v.slice(2)); if(!c){S.view="cal";return renderMain();}
    const idx = S.clients.findIndex(z=>z.id===c.id);
    const prevC = S.clients[idx-1], nextC = S.clients[idx+1];
    m.innerHTML = `<div class="csubnav">
        <button type="button" class="back" data-goto="clients">← All clients</button>
        <div class="swap">
          <button type="button" data-swap="prev" ${prevC?"":"disabled"} aria-label="Previous client">‹</button>
          <button type="button" data-swap="next" ${nextC?"":"disabled"} aria-label="Next client">›</button>
        </div>
      </div>
      <div class="head"><h2>${esc(c.name)}</h2><span class="sub">${open().filter(x=>x.client===c.id).length} open</span></div>
      <div class="clienthead facts" data-client="${c.id}">
        <div class="chrow">
          <label class="chfield">Weekly hours<input type="number" data-f="hrs" min="0" step="0.5" value="${c.hrs||0}"></label>
          <label class="chfield">Staff support<input data-f="staff" value="${esc(c.staff)}" placeholder="—"></label>
          <label class="chfield">Contact<input data-f="contact" value="${esc(c.contact)}" placeholder="Name, email"></label>
          <button type="button" class="btn-sm" data-share="${c.id}">Copy share link 🔗</button>
        </div>
        <textarea class="chnotes" data-f="notes" placeholder="Notes — anything worth remembering">${esc(c.notes)}</textarea>
      </div>
      ${filters()}${addTaskBtn(c.id)}${taskList(S.tasks.filter(x=>x.client===c.id))}`;
  }
  bind();
}

/* ---------- events ---------- */
function bind(){
  const m = $("#main");
  m.querySelectorAll("[data-addtask]").forEach(b=>b.onclick=()=>openTaskModal({clientId:b.dataset.client||null, due:b.dataset.due||null}));
  m.querySelectorAll(".task").forEach(li=>{ const x=S.tasks.find(z=>z.id===li.dataset.id); if(!x) return;
    li.querySelector("input[type=checkbox]").onchange=e=>{ x.done=e.target.checked; x.status=x.done?"done":"not_started"; render();
      persist(sb.from("tasks").update({done:x.done,status:x.status}).eq("id",x.id)); };
    li.querySelector("[data-open]").onclick=()=>openTaskModal({taskId:x.id});
    const sb2=li.querySelector("[data-statuscycle]"); if(sb2) sb2.onclick=e=>{ e.stopPropagation();
      x.status = x.status==="in_progress"? "not_started" : "in_progress"; render();
      persist(sb.from("tasks").update({status:x.status}).eq("id",x.id)); };
    li.querySelector(".logt").onclick=()=>{S.loggingFor = S.loggingFor===x.id? null : x.id; render();};
    const nolog=li.querySelector(".nolog"); if(nolog) nolog.onclick=()=>{S.loggingFor = S.loggingFor===x.id? null : x.id; render();};
    const tf=li.querySelector(".timeform"); if(tf){
      tf.onsubmit=e=>{ e.preventDefault(); const d=new FormData(tf); const hrs=+d.get("hours"); if(!hrs) return;
        S.loggingFor=null;
        addTimeEntry({date:d.get("date")||today(),client_id:x.client,who:d.get("who"),task_id:x.id,text:x.text,hours:hrs}); };
      tf.querySelector(".cancel").onclick=()=>{S.loggingFor=null;render();};
    } });
  const at = m.querySelector("#addtime"); if(at) at.onsubmit=e=>{ e.preventDefault(); const d=new FormData(at); const hrs=+d.get("hours"); if(!hrs) return;
    addTimeEntry({date:d.get("date")||today(),client_id:d.get("client"),who:d.get("who"),task_id:null,text:(d.get("text")||"").trim(),hours:hrs}); };
  m.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{ const act=b.dataset.cal;
    if(act==="prev") S.calMonth=shiftMonth(S.calMonth,-1);
    else if(act==="next") S.calMonth=shiftMonth(S.calMonth,1);
    else if(act==="today"){ S.calMonth=today().slice(0,7); S.calDay=today(); }
    else if(act==="clear") S.calDay=null;
    render(); });
  m.querySelectorAll(".calcell[data-day]").forEach(cell=>cell.onclick=()=>{ const d=cell.dataset.day; S.calDay = S.calDay===d? null : d; render(); });
  const pf = m.querySelector("#periodf"); if(pf) pf.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.timeView.mode=b.dataset.mode;render();});
  m.querySelectorAll('.rangepick input[name=start]').forEach(i=>i.onchange=()=>{S.timeView.start=i.value;render();});
  m.querySelectorAll('.rangepick input[name=end]').forEach(i=>i.onchange=()=>{S.timeView.end=i.value;render();});
  const gf = m.querySelector("#groupf"); if(gf) gf.querySelectorAll("button").forEach(b=>b.onclick=()=>{S.timeGroupBy=b.dataset.g;render();});
  m.querySelectorAll(".entry").forEach(li=>{ const e=S.timeEntries.find(z=>z.id===li.dataset.id); if(!e) return;
    li.querySelector("[name=date]").onchange=ev=>{e.date=ev.target.value||e.date;render();persist(sb.from("time_entries").update({date:e.date}).eq("id",e.id));};
    li.querySelector("[name=client]").onchange=ev=>{e.client=ev.target.value;render();persist(sb.from("time_entries").update({client_id:e.client}).eq("id",e.id));};
    li.querySelector("[name=who]").onchange=ev=>{e.who=ev.target.value;render();persist(sb.from("time_entries").update({who:e.who}).eq("id",e.id));};
    li.querySelector("[name=hours]").onchange=ev=>{const h=+ev.target.value; if(h>0){e.hours=h;render();persist(sb.from("time_entries").update({hours:h}).eq("id",e.id));} else {ev.target.value=e.hours;} };
    li.querySelector("[name=text]").onchange=ev=>{e.text=ev.target.value.trim();persist(sb.from("time_entries").update({text:e.text}).eq("id",e.id));};
    li.querySelector(".x").onclick=()=>{ if(confirm("Delete this time entry?")) deleteTimeEntry(e.id); };
  });
  m.querySelectorAll(".filters button").forEach(b=>{ if(b.closest("#periodf")||b.closest("#groupf")) return; // those have their own handlers above — don't clobber them
    b.onclick=()=>{S.filter=b.dataset.f;render();}; });
  m.querySelectorAll("[data-grouptoggle]").forEach(b=>b.onclick=()=>{ const k=b.dataset.grouptoggle; S.groupOpen[k]=!S.groupOpen[k]; render(); });
  const af=m.querySelector("#addfree"); if(af) af.onsubmit=e=>{e.preventDefault();const d=new FormData(af);
    addPerson({name:d.get("name").trim(),kind:"freelancer",role:d.get("role").trim(),rate:d.get("rate").trim(),contact:"",notes:""}).then(p=>{ if(p){ upsert(S.freelancers, p); render(); toast("Added"); } }); };
  const ac=m.querySelector("#addclient"); if(ac) ac.onsubmit=e=>{e.preventDefault(); const d=new FormData(ac);
    addClientRow(d.get("name").trim(), +d.get("hrs")||0); };
  m.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{S.view=b.dataset.goto;render();});
  m.querySelectorAll("[data-share]").forEach(b=>b.onclick=()=>copyShareLink(b.dataset.share));
  const moreExport=m.querySelector("#moreExport"); if(moreExport) moreExport.onclick=doExport;
  const moreSignout=m.querySelector("#moreSignout"); if(moreSignout) moreSignout.onclick=doSignOut;
  const swapClient=dir=>{ if(!S.view.startsWith("c:")) return; const idx=S.clients.findIndex(z=>z.id===S.view.slice(2));
    const target = dir==="next"? S.clients[idx+1] : S.clients[idx-1]; if(target){ S.view="c:"+target.id; render(); } };
  m.querySelectorAll("[data-swap]").forEach(b=>b.onclick=()=>swapClient(b.dataset.swap));
  // swipe left/right to move between clients on mobile — property assignment so re-render doesn't stack listeners
  let touchX=null;
  m.ontouchstart = e=>{ touchX = e.touches[0].clientX; };
  m.ontouchend = e=>{ if(touchX==null) return; const dx = e.changedTouches[0].clientX - touchX; touchX=null;
    if(Math.abs(dx) > 60){ swapClient(dx<0? "next":"prev"); } };
  m.querySelectorAll("[data-free]").forEach(p=>{const f=S.freelancers.find(z=>z.id===p.dataset.free);
    p.querySelectorAll("[data-f]").forEach(i=>i.onchange=()=>{f[i.dataset.f]=i.value;persist(sb.from("people").update({[i.dataset.f]:i.value}).eq("id",f.id));});
    p.querySelector(".rmfree").onclick=()=>removeFreelancer(f);});
  m.querySelectorAll(".facts").forEach(dl=>{ const c=client(dl.dataset.client); if(!c) return; dl.querySelectorAll("[data-f]").forEach(i=>i.onchange=()=>{ const v=i.type==="number"?+i.value:i.value; c[i.dataset.f]=v; persist(sb.from("clients").update({[i.dataset.f]:v}).eq("id",c.id)); if(i.dataset.f==="hrs") renderNav(); }); });
}

/* ---------- task add/edit modal ---------- */
let modalTask = null; // {id, clientId, assignees, links, status} — null when the modal is closed
function openTaskModal({taskId, clientId, due}={}){
  const x = taskId ? S.tasks.find(z=>z.id===taskId) : null;
  modalTask = { id: x?x.id:null, clientId: x? x.client : clientId, assignees: x? [...(x.assignees||[])] : [], links: x? [...(x.links||[])] : [], status: x? (x.status||"not_started") : "not_started" };
  $("#taskModalTitle").textContent = x? "Edit task" : "New task";
  const f = $("#taskForm");
  f.querySelector("[name=text]").value = x? x.text : "";
  f.querySelector("[name=due]").value = x? (x.due||"") : (due||"");
  f.querySelector("[name=est]").value = x? (x.est||"") : "";
  f.querySelector("[name=pri]").checked = x? !!x.pri : false;
  const clientWrap = $("#taskClientWrap");
  if(!modalTask.clientId){
    clientWrap.hidden=false;
    $("#taskClientSelect").innerHTML = S.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  } else clientWrap.hidden=true;
  $("#taskDeleteBtn").hidden = !x;
  renderStatusPicker();
  renderAssignPicker();
  renderLinksList();
  $("#taskModal").hidden=false;
}
function closeTaskModal(){ $("#taskModal").hidden=true; modalTask=null; }
const STATUS_LABELS = {not_started:"Not started", in_progress:"In progress", done:"Done"};
function renderStatusPicker(){
  const box = $("#statusPicker");
  box.innerHTML = Object.keys(STATUS_LABELS).map(s=>`<button type="button" class="st-${s} ${modalTask.status===s?"on":""}" data-status="${s}">${STATUS_LABELS[s]}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{ modalTask.status=b.dataset.status; renderStatusPicker(); });
}
function renderAssignPicker(){
  const box = $("#assignPicker"); box.innerHTML = PEOPLE().map(p=>`<button type="button" class="${modalTask.assignees.includes(p)?"on":""}" data-person="${esc(p)}">${esc(p)}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const p=b.dataset.person;
    if(modalTask.assignees.includes(p)) modalTask.assignees = modalTask.assignees.filter(a=>a!==p);
    else modalTask.assignees.push(p);
    renderAssignPicker(); });
}
function renderLinksList(){
  const box = $("#linksList");
  box.innerHTML = modalTask.links.map((l,i)=>`<div class="linkrow"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a><button type="button" data-rmlink="${i}" aria-label="Remove link">×</button></div>`).join("");
  box.querySelectorAll("[data-rmlink]").forEach(b=>b.onclick=()=>{ modalTask.links.splice(+b.dataset.rmlink,1); renderLinksList(); });
}
$("#taskModalClose").onclick = closeTaskModal;
$("#taskCancelBtn").onclick = closeTaskModal;
$("#taskModal").addEventListener("click", e=>{ if(e.target.id==="taskModal") closeTaskModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#taskModal").hidden) closeTaskModal(); });
$("#taskDeleteBtn").onclick = ()=>{ if(modalTask?.id && confirm("Delete this task?")){ deleteTask(modalTask.id); closeTaskModal(); } };
$("#addLinkBtn").onclick = ()=>{ const label=$("#linkLabel").value.trim(); const url=$("#linkUrl").value.trim(); if(!url) return;
  modalTask.links.push({label, url}); $("#linkLabel").value=""; $("#linkUrl").value=""; renderLinksList(); };
$("#taskForm").onsubmit = e=>{ e.preventDefault(); const d = new FormData(e.target);
  const text = d.get("text").trim(); if(!text) return;
  const clientId = modalTask.clientId || d.get("client"); if(!clientId) return;
  const payload = { text, client_id: clientId, assignees: modalTask.assignees, due: d.get("due")||null, est: d.get("est")? +d.get("est") : null, pri: !!d.get("pri"), links: modalTask.links, status: modalTask.status, done: modalTask.status==="done" };
  const editId = modalTask.id;
  closeTaskModal();
  saveTask(payload, editId);
};

function doExport(){ const a=document.createElement("a"); a.href="data:application/json,"+encodeURIComponent(JSON.stringify(S,null,2)); a.download="tourstack-ops-"+today()+".json"; a.click(); }
async function doSignOut(){ await sb.auth.signOut(); location.reload(); }
$("#export").onclick=doExport;
$("#signout").onclick=doSignOut;
$("#mAccountBtn").onclick=()=>{S.view="more";render();};

$("#authToggle").onclick=()=>{ authMode = authMode==="signin"?"signup":"signin";
  $("#authSubmit").textContent = authMode==="signin"?"Sign in":"Create account";
  $("#authToggle").textContent = authMode==="signin"?"Need an account? Sign up":"Have an account? Sign in";
  $("#authError").hidden=true; };
$("#authForm").onsubmit=async e=>{ e.preventDefault(); const d=new FormData(e.target);
  const email=d.get("email").trim(), password=d.get("password");
  $("#authError").hidden=true;
  const {data,error} = authMode==="signin"
    ? await sb.auth.signInWithPassword({email,password})
    : await sb.auth.signUp({email,password});
  if(error){ $("#authError").textContent=error.message; $("#authError").hidden=false; return; }
  if(authMode==="signup" && !data.session){ $("#authError").textContent="Check your email to confirm your account, then sign in."; $("#authError").hidden=false; authMode="signin"; $("#authSubmit").textContent="Sign in"; return; }
  await afterSignIn(data.session);
};
$("#claimNewForm").onsubmit=async e=>{ e.preventDefault(); const d=new FormData(e.target); const name=d.get("name").trim(); if(!name) return;
  const {data:{session}} = await sb.auth.getSession();
  const {data,error} = await sb.from("people").insert({name,kind:"staff",auth_user_id:session.user.id}).select().single();
  if(error) return toast("Error: "+error.message);
  ME=data; await bootApp();
};

const shareMatch = location.pathname.match(/^\/share\/([^/]+)/);
if(shareMatch) renderPublicShare(decodeURIComponent(shareMatch[1]));
else initAuth();
</script>
